name: Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build signed APK
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.BS_KEYSTORE_BASE64 }}
          BS_KEYSTORE_PASSWORD: ${{ secrets.BS_KEYSTORE_PASSWORD }}
          BS_KEY_ALIAS: ${{ secrets.BS_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/betweensets.p12"
          export BS_KEYSTORE="$RUNNER_TEMP/betweensets.p12"
          gradle --no-daemon assembleRelease -PversionCode=${{ github.run_number }}
          rm -f "$RUNNER_TEMP/betweensets.p12"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk "BetweenSets-v$N.apk"
          # Same file under a fixed name: the app's updater and the install link both fetch this one.
          cp "BetweenSets-v$N.apk" BetweenSets.apk
          gh release create "v$N" "BetweenSets-v$N.apk" BetweenSets.apk \
            --title "Between Sets v$N" \
            --notes "Built from ${GITHUB_SHA::7}. The app installs this update by itself. To install by hand: tap BetweenSets.apk below on your phone, then open it (it updates over the old version)."
