name: Android app

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace testDebugUnitTest

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: android/app/build/reports/
          if-no-files-found: ignore
          retention-days: 7

      # APK to install directly, AAB to upload to the Play Store. Both signed with the same key.
      - name: Build signed APK and Play Store bundle
        working-directory: android
        env:
          KEYSTORE_B64: ${{ secrets.BS_KEYSTORE_BASE64 }}
          BS_KEYSTORE_PASSWORD: ${{ secrets.BS_KEYSTORE_PASSWORD }}
          BS_KEY_ALIAS: ${{ secrets.BS_KEY_ALIAS }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/betweensets.p12"
          export BS_KEYSTORE="$RUNNER_TEMP/betweensets.p12"
          gradle --no-daemon assembleRelease bundleRelease -PversionCode=${{ github.run_number }}
          rm -f "$RUNNER_TEMP/betweensets.p12"

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          cp android/app/build/outputs/apk/release/app-release.apk "BetweenSets-v$N.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "BetweenSets-v$N-playstore.aab"
          # Same file under a fixed name, so releases/latest/download/BetweenSets.apk always gets the newest.
          cp "BetweenSets-v$N.apk" BetweenSets.apk
          gh release create "v$N" "BetweenSets-v$N.apk" BetweenSets.apk "BetweenSets-v$N-playstore.aab" \
            --title "Between Sets v$N" \
            --notes "Built from ${GITHUB_SHA::7}. On your phone: tap BetweenSets-v$N.apk below to download, then open it to install (it updates over the old version). The .aab file is for uploading to the Play Store."
